<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 · JetBot Studio</title>
<link rel="stylesheet" href="{{ static_url('app.css') }}">
</head>
<body class="login">
<form method="post" action="/login" class="card login-card">
  <h1>JetBot Studio</h1>
  {% module xsrf_form_html() %}
  <input type="hidden" name="next" value="{{ next_url }}">
  <label>密碼 <input type="password" name="password" autofocus autocomplete="current-password"></label>
  {% if error == 'wrong' %}<p class="err">密碼錯誤。連續錯 5 次會鎖 1 分鐘。</p>{% end %}
  {% if error == 'locked' %}<p class="err">錯太多次，請 {{ wait }} 秒後再試。</p>{% end %}
  <button class="primary">登入</button>
</form>
</body>
</html>
